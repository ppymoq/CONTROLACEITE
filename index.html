<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 10px; max-width: 500px; margin: auto; }
        .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin: 0 0 15px 0; font-size: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .prod { background: #555; color: white; text-align: center; padding: 4px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
        .cam { margin-bottom: 8px; }
        label { display: block; font-size: 10px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        input[readonly] { background: #e9f7ef; color: #196f3d; font-weight: bold; }
        input[readonly].ant { background: #f2f2f2; color: #666; }
        .inf { margin-top: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; padding: 12px; border-radius: 6px; color: #117a65; font-weight: bold; font-size: 13px; }
        .inf.rojo { background: #fadbd8; border-color: #f5b7b1; color: #922b21; }
        button { background: #d9383a; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-size: 15px; font-weight: bold; border-radius: 4px; margin-top: 15px; }
        .btn-rotar { background: #e67e22 !important; display: none; margin-top: 10px; }
        #msg { margin-top: 10px; text-align: center; font-size: 12px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="box">
    <h2>Control Diario de Inventario</h2>
    <form id="fVentas">
        <div class="cam"><label>BROASTERO:</label><input type="text" id="usu" value="GUSTAVO" required></div>
        <div class="grid">
            <div>
                <div class="prod" style="background:#d9383a;">Pollo</div>
                <div class="cam"><label>ANT:</label><input type="number" id="pQ" class="ant" readonly value="0"></div>
                <div class="cam"><label>ENTRÓ:</label><input type="number" id="pE" placeholder="0"></div>
                <div class="cam"><label>TOTAL:</label><input type="number" id="pT" readonly value="0"></div>
                <div class="cam"><label>QUEDA:</label><input type="number" id="pK" placeholder="0" required></div>
                <div class="cam"><label>VENTA:</label><input type="number" id="pV" readonly value="0"></div>
            </div>
            <div>
                <div class="prod" style="background:#f39c12;">Alitas</div>
                <div class="cam"><label>ANT:</label><input type="number" id="aQ" class="ant" readonly value="0"></div>
                <div class="cam"><label>ENTRÓ:</label><input type="number" id="aE" placeholder="0"></div>
                <div class="cam"><label>TOTAL:</label><input type="number" id="aT" readonly value="0"></div>
                <div class="cam"><label>QUEDA:</label><input type="number" id="aK" placeholder="0" required></div>
                <div class="cam"><label>VENTA:</label><input type="number" id="aV" readonly value="0"></div>
            </div>
        </div>
        <div id="card" class="inf">
            <div id="st" style="text-align:center;margin-bottom:5px;">✅ REGISTRO OK</div>
            • Piezas hoy: <span id="tH">0</span><br>
            • Acumulado Lote Aceite: <span id="tL">0</span> / 600<br>
            • Quedan aprox: <span id="tR">600</span><br>
            <small style="display:block;margin-top:5px;font-weight:normal;opacity:0.8;">Último cambio: <span id="uC">-</span></small>
        </div>
        <button type="button" id="btnRotar" class="btn-rotar">🔄 REGISTRAR CAMBIO DE ACEITE</button>
        <button type="submit" id="btnGuardar">Procesar Registro Diario</button>
    </form>
    <div id="msg">Cargando saldos de Google Sheets...</div>
</div>
<script>
    const URL = "https://script.google.com/macros/s/AKfycbx0mmT36-mk7x2TAbOONlS5KdPBEg3JDkAXjsEpso2lbBqWiDKogif2QJrL6gHaW91-sA/exec";
    let baseLote = 0;
    const $ = id => document.getElementById(id);
    const n = i => (!i || i.value.trim()==="") ? 0 : (parseFloat(i.value)||0);

    window.addEventListener('DOMContentLoaded', () => {
        fetch(URL).then(r => r.json()).then(d => {
            $('pQ').value = d.pollo_anterior||0; $('aQ').value = d.alitas_anterior||0;
            baseLote = parseFloat(d.acumulado_historico)||0;
            $('uC').textContent = d.ultimo_cambio_aceite||"Ninguno";
            $('msg').style.color = "#27ae60"; $('msg').textContent = "Saldos cargados con éxito.";
            calc();
        }).catch(e => { $('msg').textContent = "Listo para iniciar registro diario."; calc(); });
    });

    function calc() {
        $('pT').value = n($('pQ')) + n($('pE'));
        $('pV').value = Math.max(0, n($('pT')) - n($('pK')));
        $('aT').value = n($('aQ')) + n($('aE'));
        $('aV').value = Math.max(0, n($('aT')) - n($('aK')));

        const hoy = n($('pV')) + (n($('aV')) / 3);
        
        // CORRECCIÓN CLAVE: El acumulado visual del lote muestra estrictamente lo guardado en Sheets.
        // No se altera falsamente al meter ingresos en ENTRÓ mientras el QUEDA siga en su valor real.
        const tot = baseLote + hoy;
        const res = Math.max(0, 600 - tot);

        $('tH').textContent = hoy.toFixed(1);
        $('tL').textContent = tot.toFixed(1);
        $('tR').textContent = res.toFixed(1);

        if (tot >= 600) {
            $('card').className = 'inf rojo'; $('st').textContent = "⚠️ ROTAR LOTE";
            $('btnRotar').style.display = 'block';
        } else {
            $('card').className = 'inf'; $('st').textContent = "✅ REGISTRO OK";
            $('btnRotar').style.display = 'none';
        }
    }

    ['pE','pK','aE','aK'].forEach(id => $(id).addEventListener('input', calc));

    $('btnRotar').addEventListener('click', () => {
        if(!confirm("¿Confirmas el cambio físico de aceite? El contador volverá a 0.")) return;
        $('msg').style.color = "#e67e22"; $('msg').textContent = "Registrando cambio de aceite...";
        fetch(URL, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ accion: "ROTAR_ACEITE", usuario: $('usu').value, piezas_finales: baseLote })
        }).then(() => {
            $('msg').style.color = "#27ae60"; $('msg').textContent = "¡Aceite Reiniciado! Recargando...";
            setTimeout(() => location.reload(), 1200);
        }).catch(err => { $('msg').style.color = "#c0392b"; $('msg').textContent = "Error al rotar."; });
    });

    $('fVentas').addEventListener('submit', e => {
        e.preventDefault();
        $('msg').style.color = "#2980b9"; $('msg').textContent = "Guardando reporte...";
        fetch(URL, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                usuario: $('usu').value, pollo_quedo: n($('pQ')), pollo_entro: n($('pE')), pollo_total: n($('pT')), pollo_venta: n($('pV')), pollo_queda: n($('pK')),
                alitas_quedo: n($('aQ')), alitas_entro: n($('aE')), alitas_total: n($('aT')), alitas_venta: n($('aV')), alitas_queda: n($('aK'))
            })
        }).then(() => {
            $('msg').style.color = "#27ae60"; $('msg').textContent = "¡Guardado! Recargando...";
            setTimeout(() => location.reload(), 1200);
        }).catch(err => { $('msg').style.color = "#c0392b"; $('msg').textContent = "Error al guardar."; });
    });
</script>
</body>
</html>
