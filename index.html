<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Corto</title>
</head>
<body>
<div>
    <h2>Control Diario de Inventario</h2>
    <div id="fechaVisor" style="font-weight:bold; margin-bottom:10px;">Cargando fecha...</div>
    <form id="fVentas">
        <div>BROASTERO: <input type="text" id="usu" value="GUSTAVO" required></div>
        <hr>
        <h3>Pollo</h3>
        ANT: <input type="number" id="pQ" readonly value="0"><br>
        ENTRÓ: <input type="number" id="pE" placeholder="0"><br>
        TOTAL: <input type="number" id="pT" readonly value="0"><br>
        QUEDA: <input type="number" id="pK" placeholder="0"><br>
        VENTA: <input type="number" id="pV" readonly value="0">
        <hr>
        <h3>Alitas</h3>
        ANT: <input type="number" id="aQ" readonly value="0"><br>
        ENTRÓ: <input type="number" id="aE" placeholder="0"><br>
        TOTAL: <input type="number" id="aT" readonly value="0"><br>
        QUEDA: <input type="number" id="aK" placeholder="0"><br>
        VENTA: <input type="number" id="aV" readonly value="0">
        <hr>
        <div id="card" style="background:#eee; padding:10px; margin-top:10px;">
            <div id="st" style="font-weight:bold;">REGISTRO OK</div>
            Piezas hoy: <span id="tH">0</span><br>
            Acumulado Lote: <span id="tL">0</span> / 600<br>
            Quedan aprox: <span id="tR">600</span><br>
            Lote actual: <span id="uC">-</span>
        </div>
        <button type="button" id="btnRotar" style="background:orange; display:none; margin-top:10px; padding:10px;">🔄 REGISTRAR CAMBIO DE ACEITE</button>
        <br>
        <button type="submit" style="background:red; color:white; padding:10px; margin-top:10px;">Procesar Registro Diario</button>
    </form>
    <div id="msg" style="font-weight:bold; margin-top:10px;">Conectando...</div>
</div>

<script>
    const URL = "https://script.google.com/macros/s/AKfycbz04_xB_sSAa_8MyWWjqe7JC9PVa0zpMySOuQ2RWS2_lWHeFrnpggBuQbeAqWrAbCDb/exec";
    let baseLote = 0;

    function n(el) {
        if (!el || el.value.trim() === "") return 0;
        const val = parseFloat(el.value);
        return isNaN(val) ? 0 : val;
    }

    function mostrarFechaActual() {
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        const ahora = new Date();
        document.getElementById('fechaVisor').textContent = "📅 " + dias[ahora.getDay()] + " " + String(ahora.getDate()).padStart(2,'0') + "/" + String(ahora.getMonth()+1).padStart(2,'0') + "/" + ahora.getFullYear();
    }

    window.addEventListener('DOMContentLoaded', () => {
        mostrarFechaActual();
        fetch(URL).then(r => r.json()).then(d => {
            document.getElementById('pQ').value = d.pollo_anterior !== undefined ? d.pollo_anterior : 0; 
            document.getElementById('aQ').value = d.alitas_anterior !== undefined ? d.alitas_anterior : 0;
            baseLote = parseFloat(d.acumulado_historico) || 0;
            document.getElementById('uC').textContent = d.ultimo_cambio_aceite || "Lote 1";
            document.getElementById('msg').style.color = "green"; 
            document.getElementById('msg').textContent = "Saldos cargados con éxito.";
            calc();
        }).catch(e => { document.getElementById('msg').textContent = "Listo para registrar."; calc(); });
    });

    function calc() {
        const pQ = document.getElementById('pQ'), pE = document.getElementById('pE'), pT = document.getElementById('pT'), pK = document.getElementById('pK'), pV = document.getElementById('pV');
        const aQ = document.getElementById('aQ'), aE = document.getElementById('aE'), aT = document.getElementById('aT'), aK = document.getElementById('aK'), aV = document.getElementById('aV');

        pT.value = n(pQ) + n(pE);
        pV.value = Math.max(0, n(pT) - n(pK));
        aT.value = n(aQ) + n(aE);
        aV.value = Math.max(0, n(aT) - n(aK));

        const hoy = n(pV) + (n(aV) / 3);
        const tot = baseLote + hoy;
        const res = Math.max(0, 600 - tot);

        document.getElementById('tH').textContent = hoy.toFixed(1);
        document.getElementById('tL').textContent = tot.toFixed(1);
        document.getElementById('tR').textContent = res.toFixed(1);

        if (tot >= 600) {
            document.getElementById('st').textContent = "⚠️ ROTAR LOTE (CAMBIAR ACEITE)";
            document.getElementById('btnRotar').style.display = 'block';
        } else {
            document.getElementById('st').textContent = "✅ REGISTRO OK";
            document.getElementById('btnRotar').style.display = 'none';
        }
    }

    document.getElementById('pE').addEventListener('input', calc);
    document.getElementById('pK').addEventListener('input', calc);
    document.getElementById('aE').addEventListener('input', calc);
    document.getElementById('aK').addEventListener('input', calc);

    document.getElementById('btnRotar').addEventListener('click', () => {
        if(!confirm("¿Confirmas el cambio físico de aceite?")) return;
        document.getElementById('msg').textContent = "Guardando rotación...";
        fetch(URL, {
            method: 'POST', mode: 'cors', headers: {'Content-Type':'text/plain'},
            body: JSON.stringify({ accion: "ROTAR_ACEITE", usuario: document.getElementById('usu').value, piezas_finales: baseLote })
        }).then(() => {
            document.getElementById('msg').textContent = "¡Lote cerrado!";
            setTimeout(() => location.reload(), 1000);
        }).catch(() => setTimeout(() => location.reload(), 1200));
    });

    document.getElementById('fVentas').addEventListener('submit', e => {
        e.preventDefault();
        document.getElementById('msg').textContent = "Guardando reporte diario...";
        fetch(URL, {
            method: 'POST', mode: 'no-cors', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                usuario: document.getElementById('usu').value, 
                pollo_quedo: n(document.getElementById('pQ')), pollo_entro: n(document.getElementById('pE')), pollo_total: n(document.getElementById('pT')), pollo_venta: n(document.getElementById('pV')), pollo_queda: n(document.getElementById('pK')),
                alitas_quedo: n(document.getElementById('aQ')), alitas_entro: n(document.getElementById('aE')), alitas_total: n(document.getElementById('aT')), alitas_venta: n(document.getElementById('aV')), alitas_queda: n(document.getElementById('aK'))
            })
        }).then(() => {
            document.getElementById('msg').textContent = "¡Guardado con éxito!";
            setTimeout(() => location.reload(), 1200);
        }).catch(() => { document.getElementById('msg').textContent = "Error al guardar."; });
    });
</script>
</body>
</html>
