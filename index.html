<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Aceite</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Registro de Control de Aceite</h2>
    
    <form id="formularioAceite">
        <div class="campo">
            <label for="nombre">Nombre / Operario:</label>
            <input type="text" id="nombre" required>
        </div>
        <div class="campo">
            <label for="valor">Cantidad de Aceite (Litros/Valor):</label>
            <input type="number" id="valor" step="0.01" required>
        </div>
        <button type="submit">Guardar en Google Sheets</button>
    </form>

    <div id="mensaje"></div>

    <script>
        // REMPLAZA ESTA URL CON LA QUE TE DIO GOOGLE APPS SCRIPT
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzubkEM0TF2EWtv9n81gO2kZVSP8O2_wHOU1arh3uRBrYzOPzS6o1QaR_h5pz3oaJWqAQ/exec";

        document.getElementById('formularioAceite').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const mensajeDiv = document.getElementById('mensaje');
            mensajeDiv.style.color = "blue";
            mensajeDiv.textContent = "Enviando datos...";

            const datos = {
                nombre: document.getElementById('nombre').value,
                valor: document.getElementById('valor').value
            };

            // Enviamos los datos mediante POST usando fetch
            fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors', // Evita problemas de CORS al enviar a Google
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datos)
            })
            .then(() => {
                mensajeDiv.style.color = "green";
                mensajeDiv.textContent = "¡Datos guardados con éxito!";
                document.getElementById('formularioAceite').reset();
            })
            .catch(error => {
                mensajeDiv.style.color = "red";
                mensajeDiv.textContent = "Error al guardar los datos.";
                console.error('Error:', error);
            });
        });
    </script>

</body>
</html>
