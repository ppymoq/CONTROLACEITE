<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas de Pollo</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; padding: 10px; max-width: 650px; margin: auto; color: #333; }
        .contenedor { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin-top: 0; font-size: 20px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
        
        .usuario-bloque { margin-bottom: 15px; }
        .grid-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .titulo-prod { background: #555; color: white; text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        
        .campo { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: bold; color: #444; text-transform: uppercase; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-weight: 500; }
        input:focus { border-color: #d9383a; outline: none; }
        
        input[readonly].calculo { background-color: #e9f7ef; border-color: #a3e4d7; font-weight: bold; color: #196f3d; }
        input[readonly].anterior { background-color: #f2f2f2; border-color: #ccc; color: #666; font-weight: bold; cursor: not-allowed; }
        
        .barra-equivalentes { margin-top: 20px; background-color: #ffe6cc; border: 1px solid #ffb366; padding: 14px; border-radius: 4px; text-align: center; font-weight: bold; font-size: 16px; color: #d35400; transition: background 0.3s, color 0.3s; }
        .barra-equivalentes.limite-alcanzado { background-color: #c0392b !important; border-color: #922b21 !important; color: white !important; animation: pulso 1.5s infinite; }
        
        button { background-color: #d9383a; color: white; border: none; padding: 14px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-top: 20px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        button:hover { background-color: #bc2f31; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 13px; color: #7f8c8d; }
        
        @keyframes pulso { 0% { opacity: 1; } 50% { opacity: 0.85; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Control Diario de Inventario</h2>
    
    <form id="formularioVentas">
        <div class="campo usuario-bloque">
            <label for="usuario">Usuario / Broastero:</label>
            <input type="text" id="usuario" value="GUSTAVO" required>
        </div>

        <div class="grid-columnas">
            <!-- COLUMNA POLLO -->
            <div>
                <div class="titulo-prod" style="background-color: #d9383a;">Pollo</div>
                <div class="campo">
                    <label>ANTERIOR (AUTO):</label>
                    <input type="number" id="pollo_quedo" class="anterior" readonly value="0">
                </div>
                <div class="campo">
                    <label>ENTRÓ:</label>
                    <input type="number" id="pollo_entro" placeholder="0" required>
                </div>
                <div class="campo">
                    <label>TOTAL (AUTO):</label>
                    <input type="number" id="pollo_total" class="calculo" readonly value="0">
                </div>
                <div class="campo">
                    <label>QUEDA:</label>
                    <input type="number" id="pollo_queda" placeholder="0" required>
                </div>
                <div class="campo">
                    <label>VENTA DÍA (AUTO):</label>
                    <input type="number" id="pollo_venta" class="calculo" readonly value="0">
                </div>
            </div>

            <!-- COLUMNA ALITAS -->
            <div>
                <div class="titulo-prod" style="background-color: #f39c12;">Alitas</div>
                <div class="campo">
                    <label>ANTERIOR (AUTO):</label>
                    <input type="number" id="alitas_quedo" class="anterior" readonly value="0">
                </div>
                <div class="campo">
                    <label>ENTRÓ:</label>
                    <input type="number" id="alitas_entro" placeholder="0" required>
                </div>
                <div class="campo">
                    <label>TOTAL (AUTO):</label>
                    <input type="number" id="alitas_total" class="calculo" readonly value="0">
                </div>
                <div class="campo">
                    <label>QUEDA:</label>
                    <input type="number" id="alitas_queda" placeholder="0" required>
                </div>
                <div class="campo">
                    <label>VENTA DÍA (AUTO):</label>
                    <input type="number" id="alitas_venta" class="calculo" readonly value="0">
                </div>
            </div>
        </div>

        <div id="barraPiezas" class="barra-equivalentes">
            Piezas Equivalentes del Día: <span id="txtPiezas">0.00</span>
        </div>

        <button type="submit">Guardar Registro Diario</button>
    </form>

    <div id="mensaje">Conectando con Google Sheets para traer saldos...</div>
</div>

<script>
    const URL_GOOGLE_SCRIPT = "https://google.com";

    const pQuedo = document.getElementById('pollo_quedo'), pEntro = document.getElementById('pollo_entro'), pTotal = document.getElementById('pollo_total'), pQueda = document.getElementById('pollo_queda'), pVenta = document.getElementById('pollo_venta');
    const aQuedo = document.getElementById('alitas_quedo'), aEntro = document.getElementById('alitas_entro'), aTotal = document.getElementById('alitas_total'), aQueda = document.getElementById('alitas_queda'), aVenta = document.getElementById('alitas_venta');
    const barraPiezas = document.getElementById('barraPiezas'), txtPiezas = document.getElementById('txtPiezas'), mensajeDiv = document.getElementById('mensaje');

    // 1. CARGA AUTOMÁTICA DEL CIERRE ANTERIOR AL ABRIR LA APP
    window.addEventListener('DOMContentLoaded', () => {
        fetch(URL_GOOGLE_SCRIPT)
        .then(res => res.json())
        .then(datosAyer => {
            pQuedo.value = datosAyer.pollo_anterior;
            aQuedo.value = datosAyer.alitas_anterior;
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "Saldos del cierre anterior cargados.";
            calcularFormulario();
        })
        .catch(err => {
            mensajeDiv.style.color = "#e67e22";
            mensajeDiv.textContent = "Saldos en 0 (Si es tu primera vez, registra datos).";
            console.error(err);
        });
    });

    // 2. CÁCULOS MATEMÁTICOS CORREGIDOS
    function calcularFormulario() {
        const vPQuedo = parseFloat(pQuedo.value) || 0;
        const vPEntro = parseFloat(pEntro.value) || 0;
        const vPQueda = parseFloat(pQueda.value) || 0;
        
        const vPTotal = vPQuedo + vPEntro;
        pTotal.value = vPTotal;
        const vPVenta = vPTotal - vPQueda;
        pVenta.value = vPVenta >= 0 ? vPVenta : 0;

        const vAQuedo = parseFloat(aQuedo.value) || 0;
        const vAEntro = parseFloat(aEntro.value) || 0; // CORREGIDO AQUÍ
        const vAQueda = parseFloat(aQueda.value) || 0;
        
        const vATotal = vAQuedo + vAEntro;
        aTotal.value = vATotal;
        const vAVenta = vATotal - vAQueda;
        aVenta.value = vAVenta >= 0 ? vAVenta : 0;

        const piezasEquivalentes = vPVenta + (vAVenta / 3);
        txtPiezas.textContent = piezasEquivalentes.toFixed(2);

        if(piezasEquivalentes >= 600) {
            barraPiezas.classList.add('limite-alcanzado');
        } else {
            barraPiezas.classList.remove('limite-alcanzado'); // CORREGIDO AQUÍ
        }
    }

    [pEntro, pQueda, aEntro, aQueda].forEach(input => {
        input.addEventListener('input', calcularFormulario);
    });

    // 3. ENVÍO DE DATOS A GOOGLE SHEETS
    document.getElementById('formularioVentas').addEventListener('submit', function(e) {
        e.preventDefault();
        mensajeDiv.style.color = "#2980b9";
        mensajeDiv.textContent = "Guardando reporte en la base de datos...";

        const datosEnvio = {
            usuario: document.getElementById('usuario').value,
            pollo_quedo: pQuedo.value, pollo_entro: pEntro.value, pollo_total: pTotal.value, pollo_venta: pVenta.value, pollo_queda: pQueda.value,
            alitas_quedo: aQuedo.value, alitas_entro: aEntro.value, alitas_total: aTotal.value, alitas_venta: aVenta.value, alitas_queda: aQueda.value
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosEnvio)
        })
        .then(() => {
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "¡Registrado correctamente! Actualizando interfaz...";
            setTimeout(() => { location.reload(); }, 1200);
        })
        .catch(error => {
            mensajeDiv.style.color = "#c0392b";
            mensajeDiv.textContent = "Error al intentar guardar.";
            console.error(error);
        });
    });
</script>

</body>
</html>
