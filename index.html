<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Diario de Inventario</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; padding: 10px; max-width: 650px; margin: auto; color: #333; }
        .contenedor { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin-top: 0; font-size: 20px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
        .usuario-bloque { margin-bottom: 15px; }
        .grid-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .titulo-prod { background: #555; color: white; text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; font-size: 14px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .campo { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: bold; color: #444; text-transform: uppercase; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-weight: 500; }
        input:focus { border-color: #d9383a; outline: none; }
        input[readonly].calculo { background-color: #e9f7ef; border-color: #a3e4d7; font-weight: bold; color: #196f3d; }
        input[readonly].anterior { background-color: #f2f2f2; border-color: #ccc; color: #666; font-weight: bold; cursor: not-allowed; }
        .tarjeta-informe { margin-top: 20px; background-color: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 6px; color: #117a65; font-size: 15px; line-height: 1.6; }
        .tarjeta-informe.alerta-critica { background-color: #fadbd8; border-color: #f5b7b1; color: #922b21; }
        .status-ok { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; color: #196f3d; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .tarjeta-informe.alerta-critica .status-ok { color: #922b21; }
        .lista-datos { list-style: none; padding: 0; margin: 0; font-weight: 600; }
        .lista-datos li { margin-bottom: 6px; padding-left: 15px; position: relative; }
        .lista-datos li::before { content: "•"; position: absolute; left: 0; color: inherit; }
        .destaque { font-size: 17px; font-weight: bold; }
        button { background-color: #d9383a; color: white; border: none; padding: 15px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-top: 20px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        button:hover { background-color: #bc2f31; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 13px; color: #7f8c8d; }
    </style>
</head>
<body>
<div class="contenedor">
    <h2>Control Diario de Inventario</h2>
    <form id="formularioVentas">
        <div class="campo usuario-bloque">
            <label for="usuario">Usuario / Broastero:</label>
            <input type="text" id="usuario" value="GUSTAVO" required>
        </div>
        <div class="grid-columnas">
            <div>
                <div class="titulo-prod" style="background-color: #d9383a;">Pollo</div>
                <div class="campo">
                    <label>ANTERIOR (AUTO):</label>
                    <input type="number" id="pollo_quedo" class="anterior" readonly value="0">
                </div>
                <div class="campo">
                    <label>ENTRÓ (HOY):</label>
                    <input type="number" id="pollo_entro" placeholder="0" min="0">
                </div>
                <div class="campo">
                    <label>TOTAL (AUTO):</label>
                    <input type="number" id="pollo_total" class="calculo" readonly value="0">
                </div>
                <div class="campo">
                    <label>QUEDA FINAL:</label>
                    <input type="number" id="pollo_queda" placeholder="0" min="0" required>
                </div>
                <div class="campo">
                    <label>VENTA DÍA (AUTO):</label>
                    <input type="number" id="pollo_venta" class="calculo" readonly value="0">
                </div>
            </div>
            <div>
                <div class="titulo-prod" style="background-color: #f39c12;">Alitas</div>
                <div class="campo">
                    <label>ANTERIOR (AUTO):</label>
                    <input type="number" id="alitas_quedo" class="anterior" readonly value="0">
                </div>
                <div class="campo">
                    <label>ENTRÓ (HOY):</label>
                    <input type="number" id="alitas_entro" placeholder="0" min="0">
                </div>
                <div class="campo">
                    <label>TOTAL (AUTO):</label>
                    <input type="number" id="alitas_total" class="calculo" readonly value="0">
                </div>
                <div class="campo">
                    <label>QUEDA FINAL:</label>
                    <input type="number" id="alitas_queda" placeholder="0" min="0" required>
                </div>
                <div class="campo">
                    <label>VENTA DÍA (AUTO):</label>
                    <input type="number" id="alitas_venta" class="calculo" readonly value="0">
                </div>
            </div>
        </div>
        <div id="tarjetaInforme" class="tarjeta-informe">
            <div id="statusTexto" class="status-ok">✅ REGISTRO OK</div>
            <ul class="lista-datos">
                <li>Piezas equivalentes hoy: <span id="txtPiezasHoy">0</span></li>
                <li>Nuevo Acumulado del Lote: <span id="txtAcumuladoLote" class="destaque">0</span> / 600 piezas</li>
                <li style="margin-top: 10px; border-top: 1px dashed rgba(0,0,0,0.1); padding-top: 6px;">
                    ℹ️ Quedan aprox. <span id="txtRestanteLote" class="destaque">600</span> piezas para la siguiente rotación.
                </li>
            </ul>
        </div>
        <button type="submit">Procesar Registro Diario</button>
    </form>
    <div id="mensaje">Conectando con Google Sheets para traer saldos...</div>
</div>



<script>
    const URL_GOOGLE_SCRIPT = "https://google.com";
    const LIMITE_LOTE = 600; 
    let acumuladoBaseSheets = 0; 

    const pQuedo = document.getElementById('pollo_quedo'), pEntro = document.getElementById('pollo_entro'), pTotal = document.getElementById('pollo_total'), pQueda = document.getElementById('pollo_queda'), pVenta = document.getElementById('pollo_venta');
    const aQuedo = document.getElementById('alitas_quedo'), aEntro = document.getElementById('alitas_entro'), aTotal = document.getElementById('alitas_total'), aQueda = document.getElementById('alitas_queda'), aVenta = document.getElementById('alitas_venta');
    
    const tarjetaInforme = document.getElementById('tarjetaInforme');
    const statusTexto = document.getElementById('statusTexto');
    const txtPiezasHoy = document.getElementById('txtPiezasHoy');
    const txtAcumuladoLote = document.getElementById('txtAcumuladoLote');
    const txtRestanteLote = document.getElementById('txtRestanteLote');
    const mensajeDiv = document.getElementById('mensaje');

    window.addEventListener('DOMContentLoaded', () => {
        fetch(URL_GOOGLE_SCRIPT)
        .then(res => res.json())
        .then(datos => {
            pQuedo.value = datos.pollo_anterior !== undefined ? datos.pollo_anterior : 0;
            aQuedo.value = datos.alitas_anterior !== undefined ? datos.alitas_anterior : 0;
            acumuladoBaseSheets = datos.acumulado_historico || 0; 
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "Saldos y acumulados del lote cargados correctamente.";
            calcularFormulario();
        })
        .catch(err => {
            mensajeDiv.style.color = "#e67e22";
            mensajeDiv.textContent = "Saldos inicializados en 0. Listo para registrar.";
            calcularFormulario();
            console.error(err);
        });
    });

    function calcularFormulario() {
        const vPQuedo = parseFloat(pQuedo.value) === 0 ? 0 : (parseFloat(pQuedo.value) || 0);
        const vPEntro = parseFloat(pEntro.value) === 0 ? 0 : (parseFloat(pEntro.value) || 0); 
        const vPQueda = parseFloat(pQueda.value) === 0 ? 0 : (parseFloat(pQueda.value) || 0);
        
        const vPTotal = vPQuedo + vPEntro;
        pTotal.value = vPTotal;
        const vPVenta = vPTotal - vPQueda;
        pVenta.value = vPVenta >= 0 ? vPVenta : 0;

        const vAQuedo = parseFloat(aQuedo.value) === 0 ? 0 : (parseFloat(aQuedo.value) || 0);
        const vAEntro = parseFloat(aEntro.value) === 0 ? 0 : (parseFloat(aEntro.value) || 0);
        const vAQueda = parseFloat(aQueda.value) === 0 ? 0 : (parseFloat(aQueda.value) || 0);
        
        const vATotal = vAQuedo + vAEntro;
        aTotal.value = vATotal;
        const vAVenta = vATotal - vAQueda;
        aVenta.value = vAVenta >= 0 ? vAVenta : 0;

        const piezasHoy = vPVenta + (vAVenta / 3);
        txtPiezasHoy.textContent = piezasHoy.toFixed(1);

        const nuevoAcumulado = acumuladoBaseSheets + piezasHoy;
        txtAcumuladoLote.textContent = nuevoAcumulado.toFixed(1);

        const piezasRestantes = LIMITE_LOTE - nuevoAcumulado;
        txtRestanteLote.textContent = piezasRestantes >= 0 ? piezasRestantes.toFixed(1) : "0.0";

        if (nuevoAcumulado >= LIMITE_LOTE) {
            tarjetaInforme.classList.add('alerta-critica');
            statusTexto.textContent = "⚠️ REVISAR ROTACIÓN DE LOTE";
        } else {
            tarjetaInforme.classList.remove('alerta-critica');
            statusTexto.textContent = "✅ REGISTRO OK";
        }
    }

    pEntro.addEventListener('input', calcularFormulario);
    pQueda.addEventListener('input', calcularFormulario);
    aEntro.addEventListener('input', calcularFormulario);
    aQueda.addEventListener('input', calcularFormulario);

    document.getElementById('formularioVentas').addEventListener('submit', function(e) {
        e.preventDefault();
        mensajeDiv.style.color = "#2980b9";
        mensajeDiv.textContent = "Procesando y guardando registro diario...";

        const datosEnvio = {
            usuario: document.getElementById('usuario').value,
            pollo_quedo: pQuedo.value, pollo_entro: pEntro.value || 0, pollo_total: pTotal.value, pollo_venta: pVenta.value, pollo_queda: pQueda.value,
            alitas_quedo: aQuedo.value, alitas_entro: aEntro.value || 0, alitas_total: aTotal.value, alitas_venta: aVenta.value, alitas_queda: aQueda.value
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosEnvio)
        })
        .then(() => {
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "¡Registro guardado con éxito! Actualizando la página...";
            setTimeout(() => { location.reload(); }, 1200);
        })
        .catch(error => {
            mensajeDiv.style.color = "#c0392b";
            mensajeDiv.textContent = "Error al intentar guardar el registro.";
            console.error(error);
        });
    });
</script>
</body>
</html>
