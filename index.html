<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas Diarias</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; padding: 15px; max-width: 480px; margin: auto; color: #333; }
        .contenedor { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin-top: 0; font-size: 22px; text-transform: uppercase; font-weight: bold; }
        .seccion-titulo { background: #eee; text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; margin: 15px 0 10px 0; letter-spacing: 1px; }
        .campo { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 12px; font-weight: bold; color: #555; text-transform: uppercase; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        input:focus { border-color: #d9383a; outline: none; }
        input[readonly] { background-color: #e9f7ef; border-color: #a3e4d7; font-weight: bold; color: #196f3d; }
        .fila-doble { display: flex; gap: 10px; }
        .fila-doble .campo { flex: 1; }
        button { background-color: #d9383a; color: white; border: none; padding: 14px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-top: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        button:hover { background-color: #bc2f31; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Reporte de Ventas Diarias</h2>
    
    <form id="formularioVentas">
        <div class="campo">
            <label for="usuario">Usuario / Broastero:</label>
            <input type="text" id="usuario" value="GUSTAVO" required>
        </div>

        <div class="seccion-titulo">[ POLLO ]</div>

        <div class="fila-doble">
            <div class="campo">
                <label for="quedo">Pollo Quedo (Ant):</label>
                <input type="number" id="quedo" placeholder="0" required>
            </div>
            <div class="campo">
                <label for="entro">Entró Hoy:</label>
                <input type="number" id="entro" placeholder="0" required>
            </div>
        </div>

        <div class="fila-doble">
            <div class="campo">
                <label for="total">Total (Auto):</label>
                <input type="number" id="total" readonly value="0">
            </div>
            <div class="campo">
                <label for="venta">Venta del Día:</label>
                <input type="number" id="venta" placeholder="0" required>
            </div>
        </div>

        <div class="campo">
            <label for="queda">Queda Final (Auto):</label>
            <input type="number" id="queda" readonly value="0">
        </div>

        <button type="submit">Guardar en Base de Datos</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // Coloca aquí la URL exacta de tu Google Apps Script terminada en /exec
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzubkEM0TF2EWtv9n81gO2kZVSP8O2_wHOU1arh3uRBrYzOPzS6o1QaR_h5pz3oaJWqAQ/exec";

    const inputQuedo = document.getElementById('quedo');
    const inputEntro = document.getElementById('entro');
    const inputTotal = document.getElementById('total');
    const inputVenta = document.getElementById('venta');
    const inputQueda = document.getElementById('queda');

    // Función para calcular totales en tiempo real automáticamente
    function calcularValores() {
        const quedo = parseFloat(inputQuedo.value) || 0;
        const entro = parseFloat(inputEntro.value) || 0;
        const venta = parseFloat(inputVenta.value) || 0;

        const total = quedo + entro;
        const queda = total - venta;

        inputTotal.value = total;
        inputQueda.value = queda;
    }

    // Escuchar cuando el usuario escribe en las cajas numéricas
    inputQuedo.addEventListener('input', calcularValores);
    inputEntro.addEventListener('input', calcularValores);
    inputVenta.addEventListener('input', calcularValores);

    // Enviar los datos del reporte a Google Sheets
    document.getElementById('formularioVentas').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mensajeDiv = document.getElementById('mensaje');
        mensajeDiv.style.color = "#2980b9";
        mensajeDiv.textContent = "Procesando y guardando reporte...";

        const datos = {
            usuario: document.getElementById('usuario').value,
            quedo: inputQuedo.value,
            entro: inputEntro.value,
            total: inputTotal.value,
            venta: inputVenta.value,
            queda: inputQueda.value
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "¡Reporte guardado con éxito en la base de datos!";
            
            // Opcional: Reiniciar el formulario dejando el mismo usuario
            const usuarioActual = document.getElementById('usuario').value;
            document.getElementById('formularioVentas').reset();
            document.getElementById('usuario').value = usuarioActual;
            inputTotal.value = 0;
            inputQueda.value = 0;
        })
        .catch(error => {
            mensajeDiv.style.color = "#c0392b";
            mensajeDiv.textContent = "Hubo un error de conexión al guardar.";
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
