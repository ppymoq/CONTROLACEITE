<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas Diarias</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f6f9; padding: 15px; max-width: 480px; margin: auto; color: #333; }
        .contenedor { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9383a; text-align: center; margin-top: 0; font-size: 22px; text-transform: uppercase; font-weight: bold; margin-bottom: 20px; }
        .seccion-titulo { background: #eee; text-align: center; padding: 8px; font-weight: bold; border-radius: 4px; margin: 20px 0 12px 0; letter-spacing: 1px; color: #444; text-transform: uppercase; }
        .campo { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 11px; font-weight: bold; color: #666; text-transform: uppercase; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        input:focus { border-color: #d9383a; outline: none; }
        input[readonly] { background-color: #e9f7ef; border-color: #a3e4d7; font-weight: bold; color: #196f3d; }
        .fila-doble { display: flex; gap: 10px; }
        .fila-doble .campo { flex: 1; }
        button { background-color: #d9383a; color: white; border: none; padding: 14px; width: 100%; cursor: pointer; font-size: 16px; font-weight: bold; border-radius: 4px; text-transform: uppercase; margin-top: 25px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        button:hover { background-color: #bc2f31; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Reporte de Ventas Diarias</h2>
    
    <form id="formularioVentas">
        <div class="campo">
            <label for="usuario">Usuario / Broastero:</label>
            <input type="text" id="usuario" value="GUSTAVO" required>
        </div>

        <!-- SECCIÓN POLLO -->
        <div class="seccion-titulo">[ POLLO ]</div>
        <div class="fila-doble">
            <div class="campo">
                <label for="pollo_quedo">Anterior (Quedo):</label>
                <input type="number" id="pollo_quedo" placeholder="0" required>
            </div>
            <div class="campo">
                <label for="pollo_entro">Entró Hoy:</label>
                <input type="number" id="pollo_entro" placeholder="0" required>
            </div>
        </div>
        <div class="fila-doble">
            <div class="campo">
                <label for="pollo_total">Total (Auto):</label>
                <input type="number" id="pollo_total" readonly value="0">
            </div>
            <div class="campo">
                <label for="pollo_venta">Venta del Día:</label>
                <input type="number" id="pollo_venta" placeholder="0" required>
            </div>
        </div>
        <div class="campo">
            <label for="pollo_queda">Queda Final (Auto):</label>
            <input type="number" id="pollo_queda" readonly value="0">
        </div>

        <!-- SECCIÓN ALITAS -->
        <div class="seccion-titulo">[ ALITAS ]</div>
        <div class="fila-doble">
            <div class="campo">
                <label for="alitas_quedo">Anterior (Quedo):</label>
                <input type="number" id="alitas_quedo" placeholder="0" required>
            </div>
            <div class="campo">
                <label for="alitas_entro">Entró Hoy:</label>
                <input type="number" id="alitas_entro" placeholder="0" required>
            </div>
        </div>
        <div class="fila-doble">
            <div class="campo">
                <label for="alitas_total">Total (Auto):</label>
                <input type="number" id="alitas_total" readonly value="0">
            </div>
            <div class="campo">
                <label for="alitas_venta">Venta del Día:</label>
                <input type="number" id="alitas_venta" placeholder="0" required>
            </div>
        </div>
        <div class="campo">
            <label for="alitas_queda">Queda Final (Auto):</label>
            <input type="number" id="alitas_queda" readonly value="0">
        </div>

        <button type="submit">Guardar en Base de Datos</button>
    </form>

    <div id="mensaje"></div>
</div>

<script>
    // URL de tu Google Apps Script terminada en /exec
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbzubkEM0TF2EWtv9n81gO2kZVSP8O2_wHOU1arh3uRBrYzOPzS6o1QaR_h5pz3oaJWqAQ/exec";

    // Elementos de Pollo
    const pQuedo = document.getElementById('pollo_quedo');
    const pEntro = document.getElementById('pollo_entro');
    const pTotal = document.getElementById('pollo_total');
    const pVenta = document.getElementById('pollo_venta');
    const pQueda = document.getElementById('pollo_queda');

    // Elementos de Alitas
    const aQuedo = document.getElementById('alitas_quedo');
    const aEntro = document.getElementById('alitas_entro');
    const aTotal = document.getElementById('alitas_total');
    const aVenta = document.getElementById('alitas_venta');
    const aQueda = document.getElementById('alitas_queda');

    // Cálculos en tiempo real
    function calcularTotales() {
        // Pollo
        const vPQuedo = parseFloat(pQuedo.value) || 0;
        const vPEntro = parseFloat(pEntro.value) || 0;
        const vPVenta = parseFloat(pVenta.value) || 0;
        const vPTotal = vPQuedo + vPEntro;
        pTotal.value = vPTotal;
        pQueda.value = vPTotal - vPVenta;

        // Alitas
        const vAQuedo = parseFloat(aQuedo.value) || 0;
        const vAEntro = parseFloat(aEntro.value) || 0;
        const vAVenta = parseFloat(aVenta.value) || 0;
        const vATotal = vAQuedo + vAEntro;
        aTotal.value = vATotal;
        aQueda.value = vATotal - vAVenta;
    }

    // Escuchar entradas en ambos bloques
    [pQuedo, pEntro, pVenta, aQuedo, aEntro, aVenta].forEach(input => {
        input.addEventListener('input', calcularTotales);
    });

    // Envío del formulario
    document.getElementById('formularioVentas').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const mensajeDiv = document.getElementById('mensaje');
        mensajeDiv.style.color = "#2980b9";
        mensajeDiv.textContent = "Guardando reporte completo...";

        const datos = {
            usuario: document.getElementById('usuario').value,
            pollo_quedo: pQuedo.value,
            pollo_entro: pEntro.value,
            pollo_total: pTotal.value,
            pollo_venta: pVenta.value,
            pollo_queda: pQueda.value,
            alitas_quedo: aQuedo.value,
            alitas_entro: aEntro.value,
            alitas_total: aTotal.value,
            alitas_venta: aVenta.value,
            alitas_queda: aQueda.value
        };

        fetch(URL_GOOGLE_SCRIPT, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensajeDiv.style.color = "#27ae60";
            mensajeDiv.textContent = "¡Reporte enviado! Se agregaron 2 filas a la base de datos.";
            
            const usuarioActual = document.getElementById('usuario').value;
            document.getElementById('formularioVentas').reset();
            document.getElementById('usuario').value = usuarioActual;
            pTotal.value = 0; pQueda.value = 0;
            aTotal.value = 0; aQueda.value = 0;
        })
        .catch(error => {
            mensajeDiv.style.color = "#c0392b";
            mensajeDiv.textContent = "Error de conexión al procesar los datos.";
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
